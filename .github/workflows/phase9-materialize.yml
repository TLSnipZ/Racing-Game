name: Materialize verified Phase 9 source
on:
  push:
    branches: [prepare/9-heat-apply]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Apply checksummed source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.phase9/chunk-{i}.txt').read_text().strip() for i in range(6))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f5094a7b98edeed01180a9a118f0c60cf8dfb4753d6cbf914671213cedc4bdf1'
          changes = json.loads(raw)
          assert len(changes) == 35
          for name, item in changes.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src', 'tests', 'docs', 'README.md', 'CHANGELOG.md')
              before = path.read_text(encoding='utf-8') if path.exists() else ''
              assert hashlib.sha256(before.encode()).hexdigest() == item['before'], name
              after = before
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(before)
                  after = after[:start] + replacement + after[end:]
              assert hashlib.sha256(after.encode()).hexdigest() == item['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(after, encoding='utf-8')
              print('Verified', name)
          PY
      - name: Store the clean tree on staging only
        run: |
          git rm -r -- .phase9 .github/workflows/phase9-materialize.yml
          git add -A
          tree=$(git write-tree)
          test "$tree" = 912d82c90a493ad0bd90dc71193848b647be162e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialize verified Phase 9 source tree'
          git push origin HEAD:refs/heads/staging/9-heat-materialized
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
